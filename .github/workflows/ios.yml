name: iOS build and tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/native-game-ir-player]

jobs:
  xcode:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test native XCTest feedback parser
        run: python3 -m unittest discover -s tools/test-feedback -p "test_*.py" -v
      - name: List Xcode schemes
        run: xcodebuild -list -project Hephaestus.xcodeproj
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Hephaestus.xcodeproj -scheme Hephaestus -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/build.log || { grep -E "error:" /tmp/build.log | sort -u | head -20 | while read -r l; do echo "::error title=xcodebuild::$l"; done; exit 1; }
      # Unit tests only. The template UI tests (HephaestusUITests) are
      # excluded: testLaunchPerformance made this step take ~15 minutes
      # and its repeated app launches were the main flake source. They
      # still run locally from Xcode. The simulator is resolved at
      # runtime instead of hardcoding a device name that runner images
      # may not carry, and the step retries once to absorb simulator
      # boot flakes.
      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone [0-9]' | head -n 1 | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on iPhone simulator $UDID"
          set +e
          xcodebuild test -project Hephaestus.xcodeproj -scheme Hephaestus -destination "platform=iOS Simulator,id=$UDID" -only-testing:HephaestusTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/unit.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "First test attempt failed with exit $status; retrying once"
            xcodebuild test -project Hephaestus.xcodeproj -scheme Hephaestus -destination "platform=iOS Simulator,id=$UDID" -only-testing:HephaestusTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a /tmp/unit.log
            status=${PIPESTATUS[0]}
          fi
          if [ $status -ne 0 ]; then
            grep -E "error:" /tmp/unit.log | sort -u | head -20 | while read -r l; do echo "::error title=xcodebuild-test::$l"; done
          fi
          exit $status
      # Same advisory producer as the smoke job (Phase 2b), for Layer 0:
      # unit tests run on the simulator but need no device behaviour, so
      # they are layer 0. The producer dedupes by case id, so the retry
      # above never double-counts a case. Never gates this job.
      - name: Build unit test-feedback artifact
        if: always()
        run: |
          python3 tools/test-feedback/xcresult-to-feedback.py \
            --log /tmp/unit.log --out /tmp/test-feedback-unit.json \
            --run-id "unit-${{ github.run_id }}-${{ github.run_attempt }}" \
            --commit "${{ github.sha }}" --layer 0 --prefix unit || true
      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: |
            /tmp/unit.log
            /tmp/test-feedback-unit.json
          if-no-files-found: ignore

  # Phase 4 device matrix: the player smoke test drives the real app on
  # a simulator — Discover feed -> Play -> WKWebView player boots a game
  # served by the production backend. Kept as its own job: it depends on
  # the live backend, so it must never gate the unit tests above.
  player-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run player smoke test
        run: |
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone [0-9]' | head -n 1 | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Smoke testing on iPhone simulator $UDID"
          # Warm the production backend first: the Replit deployment
          # cold-starts after idle, and its first response can take most
          # of a minute — the app's feed fetch should not have to absorb
          # that inside the test's wait budget. (Three consecutive CI
          # runs failed with the Play button appearing just past the
          # 60s wait while a warm backend answers in ~1s.)
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://html-5-game-generator.replit.app/v1/feed || true)
            echo "backend warm-up attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          # Boot the device ourselves and wait for it, then forbid
          # parallel-testing clones: across four runs the failure was
          # never inside the test — xcodebuild's "Clone 1 of iPhone 17
          # Pro" either stalled ~63s before the test started or had its
          # runner launch denied by SpringBoard outright
          # (FBSOpenApplicationServiceErrorDomain). Running on the
          # booted device itself removes the clone from the path.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Single attempt, deliberately: the earlier manual retry ran
          # xcodebuild back-to-back against the same destination and the
          # second run's simulator clone was denied launch by
          # SpringBoard in two consecutive runs — the retry produced
          # noise, not signal.
          set -o pipefail
          xcodebuild test -project Hephaestus.xcodeproj -scheme Hephaestus -destination "platform=iOS Simulator,id=$UDID" -only-testing:HephaestusUITests/PlayerSmokeTests -parallel-testing-enabled NO -resultBundlePath /tmp/smoke.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/smoke.log || { grep -E "error:" /tmp/smoke.log | sort -u | head -20 | while read -r l; do echo "::error title=xcodebuild-smoke::$l"; done; exit 1; }
      # Phase 2b producer: turn the smoke run into a test-feedback.json
      # artifact for the AI coding feedback loop. Advisory only — it
      # never fails this job (the script exits 0 even when it cannot
      # parse the log, emitting a skip case instead), and the smoke
      # test's own verdict remains the gate.
      - name: Build test-feedback artifact
        if: always()
        run: |
          python3 tools/test-feedback/xcresult-to-feedback.py \
            --log /tmp/smoke.log --out /tmp/test-feedback.json \
            --run-id "smoke-${{ github.run_id }}-${{ github.run_attempt }}" \
            --commit "${{ github.sha }}" --layer 1 --prefix player-smoke || true
      # Export native screenshots to a reviewable artifact directory rather
      # than burying them inside the binary .xcresult. Always run, including
      # on UI test failure, so the failed frame remains available for triage.
      - name: Export iPhone smoke screenshot evidence
        if: always()
        shell: bash
        run: |
          if [[ -d "/tmp/smoke.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "/tmp/smoke.xcresult" \
              --output-path "/tmp/iphone-smoke-screenshots"
          else
            echo "No .xcresult from this run; consult the preceding test failure log."
          fi
      # A raw app-window PNG may carry an EXIF orientation that makes its
      # stored width/height misleading. Validate the original full-screen
      # landscape attachments with the same byte-preserving verifier used
      # for the iPad; never silently rotate, crop, or approve media.
      - name: Validate native iPhone screenshot orientation and review evidence
        if: always() && hashFiles('tools/test-feedback/verify-ui-screenshot-evidence.py') != ''
        run: |
          python3 tools/test-feedback/verify-ui-screenshot-evidence.py \
            --input /tmp/iphone-smoke-screenshots \
            --out /tmp/iphone-smoke-review
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-smoke
          path: |
            /tmp/smoke.log
            /tmp/smoke.xcresult
            /tmp/iphone-smoke-screenshots
            /tmp/iphone-smoke-review
            /tmp/test-feedback.json
          if-no-files-found: ignore

  # Real iPad UI evaluation at a regular-width size class.
  ipad-feed-ui-evaluator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Find an available iPad simulator
        id: ipad
        run: |
          UDID=$(xcrun simctl list devices available | grep -E 'iPad' | head -n 1 | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "No available iPad simulator found on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Evaluating feed UI on iPad simulator $UDID"
      - name: Warm the live feed backend
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://html-5-game-generator.replit.app/v1/feed || true)
            echo "backend warm-up attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
      - name: Boot iPad simulator
        run: |
          xcrun simctl boot "${{ steps.ipad.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.ipad.outputs.udid }}" -b
      - name: Run iPad feed UI evaluator
        run: |
          set -o pipefail
          xcodebuild test -project Hephaestus.xcodeproj -scheme Hephaestus \
            -destination "platform=iOS Simulator,id=${{ steps.ipad.outputs.udid }}" \
            -only-testing:HephaestusUITests/PlayerSmokeTests/testDiscoverFeedUIEvaluationAndSwipe \
            -only-testing:HephaestusUITests/PlayerSmokeTests/testDiscoverFeedSupportsAccessibilityDynamicType \
            -only-testing:HephaestusUITests/PlayerSmokeTests/testArcadePulseCreateEntryConsentAndControls \
            -parallel-testing-enabled NO -resultBundlePath /tmp/ipad-feed-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/ipad-feed-ui.log || {
              grep -E "error:|XCTAssert" /tmp/ipad-feed-ui.log | sort -u | head -30 | while read -r l; do
                echo "::error title=ipad-feed-ui::$l"
              done
              exit 1
            }
      - name: Build iPad UI test-feedback artifact
        if: always()
        run: |
          python3 tools/test-feedback/xcresult-to-feedback.py \
            --log /tmp/ipad-feed-ui.log --out /tmp/test-feedback-ipad.json \
            --run-id "ipad-feed-${{ github.run_id }}-${{ github.run_attempt }}" \
            --commit "${{ github.sha }}" --layer 1 --prefix ipad-feed || true
      # Export native screenshots to a reviewable artifact directory rather
      # than burying them inside the binary .xcresult. Always run, including
      # on UI test failure, so the failed frame remains available for triage.
      - name: Export iPad feed screenshot evidence
        if: always()
        shell: bash
        run: |
          if [[ -d "/tmp/ipad-feed-ui.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "/tmp/ipad-feed-ui.xcresult" \
              --output-path "/tmp/ipad-feed-ui-screenshots"
          else
            echo "No .xcresult from this run; consult the preceding test failure log."
          fi
      # Native app-window landscape attachments can export with a misleading
      # portrait crop and black bands. Keep originals; validate and separately
      # publish orientation-correct *full-screen* evidence for review.
      - name: Validate native iPad screenshot orientation and review evidence
        run: |
          python3 tools/test-feedback/verify-ui-screenshot-evidence.py \
            --input /tmp/ipad-feed-ui-screenshots \
            --out /tmp/ipad-feed-ui-review
      - name: Upload iPad UI evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-feed-ui-evaluator
          path: |
            /tmp/ipad-feed-ui.log
            /tmp/ipad-feed-ui.xcresult
            /tmp/ipad-feed-ui-screenshots
            /tmp/ipad-feed-ui-review
            /tmp/test-feedback-ipad.json
          if-no-files-found: ignore
